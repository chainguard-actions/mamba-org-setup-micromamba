name: Test post cleanup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  test-post-cleanup:
    name: ${{ matrix.post-cleanup }}
    strategy:
      matrix:
        include:
          - post-cleanup: 'none'
            mamba-init-block-exists: ''
            mamba-activate-exists: ''
            env-exists: ''
            root-exists: ''
            binary-exists: ''
          - post-cleanup: 'shell-init'
            mamba-init-block-exists: '! '
            mamba-activate-exists: '! '
            env-exists: ''
            root-exists: ''
            binary-exists: ''
          - post-cleanup: 'environment'
            mamba-init-block-exists: '! '
            mamba-activate-exists: '! '
            env-exists: '! '
            root-exists: ''
            binary-exists: ''
          - post-cleanup: 'all'
            mamba-init-block-exists: '! '
            mamba-activate-exists: '! '
            env-exists: '! '
            root-exists: '! '
            binary-exists: '! '
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # This is a fork of webiny/action-post-run. If webiny/action-post-run is updated, this should be updated as well.
      - uses: lisanna-dettwyler/action-post-run@d053b9b43d788b87a409f6cdb3b6fc87c6c8a4fe
        env:
          MAMBA_INIT_BLOCK_EXISTS: ${{ matrix.mamba-init-block-exists }}
          MAMBA_ACTIVATE_EXISTS: ${{ matrix.mamba-activate-exists }}
          ENV_EXISTS: ${{ matrix.env-exists }}
          ROOT_EXISTS: ${{ matrix.root-exists }}
          BINARY_EXISTS: ${{ matrix.binary-exists }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        with:
          run: |
            set -euxo pipefail
            ${MAMBA_INIT_BLOCK_EXISTS}grep -F "mamba initialize" ~/.bash_profile
            ${MAMBA_INIT_BLOCK_EXISTS}grep -F "mamba initialize" ~/.bashrc
            ${MAMBA_ACTIVATE_EXISTS}grep -F "mamba activate" ~/.bash_profile
            ${ENV_EXISTS}test -d ~/micromamba/envs/env-name
            ${ROOT_EXISTS}test -d ~/micromamba
            ${BINARY_EXISTS}test -f ~/micromamba-bin/micromamba
            ${BINARY_EXISTS}test -f "$RUNNER_TEMP_DIR/setup-micromamba/.condarc"
      - uses: ./
        with:
          environment-file: 'test/environment.yml'
          init-shell: bash
          post-cleanup: ${{ matrix.post-cleanup }}
      - env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euxo pipefail
          grep -F "mamba initialize" ~/.bash_profile
          grep -F "mamba initialize" ~/.bashrc
          grep -F "mamba activate" ~/.bash_profile
          test -d ~/micromamba/envs/env-name
          test -d ~/micromamba
          test -f ~/micromamba-bin/micromamba
          test -f "$RUNNER_TEMP_DIR/setup-micromamba/.condarc"
