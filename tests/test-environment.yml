name: Test micromamba environment creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          micromamba-version: 'latest'
          micromamba-root-path: /tmp/micromamba-root
          micromamba-binary-path: /tmp/micromamba-bin/micromamba
          environment-file: actions/hardened/mamba-org--setup-micromamba/v2.0.7/tests/fixtures/environment.yml
          environment-name: myenv
          create-args: >-
            pip
          init-shell: none
          log-level: info
          post-cleanup: environment
      - name: Assert environment-path output is set
        env:
          ENV_PATH: ${{ steps.action.outputs.environment-path }}
        run: |
          echo "environment-path: $ENV_PATH"
          if [ -z "$ENV_PATH" ]; then
            echo "FAIL: environment-path output is empty"
            exit 1
          fi
          echo "PASS: environment-path is set to $ENV_PATH"
      - name: Assert environment directory exists
        env:
          ENV_PATH: ${{ steps.action.outputs.environment-path }}
        run: |
          echo "Checking environment directory: $ENV_PATH"
          if [ ! -d "$ENV_PATH" ]; then
            echo "FAIL: environment directory not found at $ENV_PATH"
            exit 1
          fi
          echo "PASS: environment directory exists"
      - name: Assert python is installed in environment
        env:
          ENV_PATH: ${{ steps.action.outputs.environment-path }}
        run: |
          echo "Checking for python in $ENV_PATH/bin"
          if [ ! -f "$ENV_PATH/bin/python" ]; then
            echo "FAIL: python not found in environment"
            exit 1
          fi
          echo "PASS: python found in environment"
