name: Test custom micromamba paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          micromamba-root-path: /tmp/custom-mamba-root
          micromamba-binary-path: /tmp/custom-mamba-bin/micromamba
          init-shell: none
          post-cleanup: none
      - name: Assert micromamba binary is at custom path
        run: |
          MAMBA_BIN="/tmp/custom-mamba-bin/micromamba"
          echo "Checking micromamba at: $MAMBA_BIN"
          if [ ! -f "$MAMBA_BIN" ]; then
            echo "FAIL: micromamba binary not found at custom path: $MAMBA_BIN"
            exit 1
          fi
          echo "PASS: micromamba binary found at custom path"
      - name: Assert MAMBA_ROOT_PREFIX points to custom root
        run: |
          echo "MAMBA_ROOT_PREFIX: $MAMBA_ROOT_PREFIX"
          if [ "$MAMBA_ROOT_PREFIX" != "/tmp/custom-mamba-root" ]; then
            echo "FAIL: expected MAMBA_ROOT_PREFIX=/tmp/custom-mamba-root but got: $MAMBA_ROOT_PREFIX"
            exit 1
          fi
          echo "PASS: MAMBA_ROOT_PREFIX is set to custom root"
      - name: Assert MAMBA_EXE points to custom binary
        run: |
          echo "MAMBA_EXE: $MAMBA_EXE"
          if [ "$MAMBA_EXE" != "/tmp/custom-mamba-bin/micromamba" ]; then
            echo "FAIL: expected MAMBA_EXE=/tmp/custom-mamba-bin/micromamba but got: $MAMBA_EXE"
            exit 1
          fi
          echo "PASS: MAMBA_EXE is set to custom binary path"
      - name: Assert micromamba is functional
        run: |
          VERSION=$(/tmp/custom-mamba-bin/micromamba --version 2>&1 || true)
          echo "micromamba version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: micromamba --version returned empty output"
            exit 1
          fi
          echo "PASS: micromamba is functional at custom path"
