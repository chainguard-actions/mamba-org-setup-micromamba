name: Test custom paths and download options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          micromamba-version: 'latest'
          download-micromamba: 'true'
          micromamba-binary-path: '/tmp/custom-micromamba-bin/micromamba'
          micromamba-root-path: '/tmp/custom-micromamba-root'
          micromamba-url: ''
          init-shell: 'none'
          post-cleanup: 'all'
      - name: Assert micromamba binary exists at custom path
        run: |
          if [ ! -f "/tmp/custom-micromamba-bin/micromamba" ]; then
            echo "FAIL: micromamba binary not found at custom path /tmp/custom-micromamba-bin/micromamba"
            exit 1
          fi
          echo "PASS: micromamba binary found at custom path"
          /tmp/custom-micromamba-bin/micromamba --version
      - name: Assert micromamba root path exists
        run: |
          if [ ! -d "/tmp/custom-micromamba-root" ]; then
            echo "FAIL: micromamba root directory not found at /tmp/custom-micromamba-root"
            exit 1
          fi
          echo "PASS: micromamba root directory exists"
