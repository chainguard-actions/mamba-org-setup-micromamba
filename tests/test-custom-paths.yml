name: Test micromamba-binary-path and micromamba-root-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          micromamba-binary-path: /tmp/custom-mamba-bin/micromamba
          micromamba-root-path: /tmp/custom-mamba-root
          init-shell: none
          generate-run-shell: "false"
          post-cleanup: shell-init
      - name: Assert micromamba binary exists at custom path
        run: |
          if [ ! -f "/tmp/custom-mamba-bin/micromamba" ]; then
            echo "FAIL: micromamba binary not found at custom path /tmp/custom-mamba-bin/micromamba"
            exit 1
          fi
          echo "PASS: micromamba binary found at custom path"
      - name: Assert micromamba root exists at custom path
        run: |
          if [ ! -d "/tmp/custom-mamba-root" ]; then
            echo "FAIL: micromamba root not found at custom path /tmp/custom-mamba-root"
            exit 1
          fi
          echo "PASS: micromamba root found at custom path"
