name: Test cache-downloads inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          init-shell: bash
          generate-run-shell: "false"
          post-cleanup: none
          cache-downloads: "false"
          cache-downloads-key: test-downloads-key
      - name: Assert micromamba is installed
        run: |
          MAMBA_BIN="$HOME/micromamba-bin/micromamba"
          if command -v micromamba &>/dev/null; then
            MAMBA_BIN="$(command -v micromamba)"
          fi
          echo "micromamba binary: $MAMBA_BIN"
          "$MAMBA_BIN" --version
          echo "PASS: micromamba installed successfully with cache-downloads=false"
