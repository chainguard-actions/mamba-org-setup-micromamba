name: Test cache-downloads and cache-downloads-key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-downloads: "true"
          cache-downloads-key: test-cache-downloads-key-${{ github.run_id }}
          init-shell: none
          generate-run-shell: "false"
          post-cleanup: shell-init
      - name: Assert micromamba is available
        run: |
          if ! command -v micromamba &>/dev/null; then
            echo "FAIL: micromamba not found on PATH"
            exit 1
          fi
          echo "PASS: micromamba available with cache-downloads enabled"
