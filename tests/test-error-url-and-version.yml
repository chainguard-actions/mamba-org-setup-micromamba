name: Test error when both url and version are specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          micromamba-version: "1.5.10-0"
          micromamba-url: "https://github.com/mamba-org/micromamba-releases/releases/download/1.5.10-0/micromamba-linux-64"
          init-shell: none
          post-cleanup: none
      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both micromamba-url and micromamba-version are specified, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when both url and version were specified"
