name: Test micromamba-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/latest/download/micromamba-linux-64
          init-shell: none
          generate-run-shell: false
          post-cleanup: none
      - name: Assert micromamba is available
        run: |
          if ! command -v micromamba &> /dev/null; then
            echo "FAIL: micromamba not found on PATH"
            exit 1
          fi
          VERSION=$(micromamba --version 2>&1 || true)
          echo "micromamba version: $VERSION"
          echo "PASS: micromamba installed from custom URL"
