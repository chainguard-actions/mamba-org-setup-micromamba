name: Test micromamba-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.0.5-0/micromamba-linux-64
          init-shell: none
          post-cleanup: all
      - name: Assert micromamba is available
        run: |
          which micromamba || (echo "FAIL: micromamba not found on PATH" && exit 1)
          echo "PASS: micromamba is available"
      - name: Assert micromamba version matches expected
        run: |
          VERSION=$(micromamba --version 2>&1 | head -1)
          echo "micromamba version: $VERSION"
          if echo "$VERSION" | grep -q "2.0.5"; then
            echo "PASS: micromamba version matches expected (2.0.5)"
          else
            echo "FAIL: expected version 2.0.5 but got: $VERSION"
            exit 1
          fi
