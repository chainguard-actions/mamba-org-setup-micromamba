name: Test micromamba with condarc configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          micromamba-version: 'latest'
          condarc: |
            channels:
              - conda-forge
              - defaults
            channel_priority: strict
          environment-name: 'condarc-env'
          create-args: >-
            python=3.11
          init-shell: 'none'
          generate-run-shell: 'false'
          post-cleanup: 'none'
      - name: Assert environment-path output is set
        env:
          ENV_PATH: ${{ steps.action.outputs.environment-path }}
        run: |
          echo "environment-path: $ENV_PATH"
          if [ -z "$ENV_PATH" ]; then
            echo "FAIL: environment-path output is empty"
            exit 1
          fi
          echo "PASS: environment-path is set to $ENV_PATH"
      - name: Assert environment directory exists
        env:
          ENV_PATH: ${{ steps.action.outputs.environment-path }}
        run: |
          echo "Checking environment directory: $ENV_PATH"
          if [ ! -d "$ENV_PATH" ]; then
            echo "FAIL: environment directory does not exist at $ENV_PATH"
            exit 1
          fi
          echo "PASS: environment directory exists"
      - name: Assert micromamba binary is present
        run: |
          MICROMAMBA_BIN="$HOME/micromamba-bin/micromamba"
          echo "Checking micromamba binary at: $MICROMAMBA_BIN"
          if [ ! -f "$MICROMAMBA_BIN" ]; then
            echo "FAIL: micromamba binary not found at $MICROMAMBA_BIN"
            exit 1
          fi
          "$MICROMAMBA_BIN" --version
          echo "PASS: micromamba binary is present and functional"
