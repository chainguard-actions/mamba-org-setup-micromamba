name: Test micromamba environment creation from file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          environment-file: tests/fixtures/environment.yml
          init-shell: none
          generate-run-shell: "false"
          post-cleanup: none
          log-level: info
      - name: Assert environment-path output is set
        env:
          ENV_PATH: ${{ steps.setup.outputs.environment-path }}
        run: |
          echo "environment-path: '$ENV_PATH'"
          if [ -z "$ENV_PATH" ]; then
            echo "FAIL: expected environment-path to be set"
            exit 1
          fi
          echo "PASS: environment-path is set to '$ENV_PATH'"
      - name: Assert environment directory exists
        env:
          ENV_PATH: ${{ steps.setup.outputs.environment-path }}
        run: |
          echo "Checking environment directory: $ENV_PATH"
          if [ ! -d "$ENV_PATH" ]; then
            echo "FAIL: environment directory does not exist at $ENV_PATH"
            exit 1
          fi
          echo "PASS: environment directory exists"
      - name: Assert python is available in the environment
        env:
          ENV_PATH: ${{ steps.setup.outputs.environment-path }}
        run: |
          PYTHON_BIN="$ENV_PATH/bin/python"
          echo "Checking python binary: $PYTHON_BIN"
          if [ ! -f "$PYTHON_BIN" ]; then
            echo "FAIL: python binary not found in environment"
            exit 1
          fi
          PYTHON_VERSION="$("$PYTHON_BIN" --version 2>&1)"
          echo "Python version: $PYTHON_VERSION"
          if echo "$PYTHON_VERSION" | grep -q "3.10"; then
            echo "PASS: Python 3.10 is installed in the environment"
          else
            echo "FAIL: expected Python 3.10, got: $PYTHON_VERSION"
            exit 1
          fi
