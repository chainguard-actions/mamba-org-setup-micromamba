name: Test environment creation from environment file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          environment-file: tests/fixtures/environment.yml
          init-shell: bash
          generate-run-shell: "false"
          post-cleanup: none
      - name: Assert environment-path output is set
        env:
          ENV_PATH: ${{ steps.action.outputs.environment-path }}
        run: |
          echo "environment-path: $ENV_PATH"
          if [ -z "$ENV_PATH" ]; then
            echo "FAIL: environment-path output is empty"
            exit 1
          fi
          echo "PASS: environment-path is set to '$ENV_PATH'"
      - name: Assert environment directory exists
        env:
          ENV_PATH: ${{ steps.action.outputs.environment-path }}
        run: |
          echo "Checking environment directory: $ENV_PATH"
          if [ ! -d "$ENV_PATH" ]; then
            echo "FAIL: environment directory does not exist at '$ENV_PATH'"
            exit 1
          fi
          echo "PASS: environment directory exists"
      - name: Assert environment name matches fixture
        env:
          ENV_PATH: ${{ steps.action.outputs.environment-path }}
        run: |
          # The environment name from the fixture file is 'fixture-env'
          echo "environment-path: $ENV_PATH"
          if echo "$ENV_PATH" | grep -q "fixture-env"; then
            echo "PASS: environment path contains expected name 'fixture-env'"
          else
            echo "FAIL: environment path '$ENV_PATH' does not contain 'fixture-env'"
            exit 1
          fi
