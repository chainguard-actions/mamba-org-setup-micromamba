name: Test create environment with packages via create-args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          environment-name: test-env
          create-args: >-
            python=3.11
          init-shell: bash
          generate-run-shell: false
      - name: Assert environment-path output is set
        env:
          ENV_PATH: ${{ steps.setup.outputs.environment-path }}
        run: |
          echo "environment-path: $ENV_PATH"
          if [ -z "$ENV_PATH" ]; then
            echo "FAIL: environment-path output is empty"
            exit 1
          fi
          echo "PASS: environment-path is set to $ENV_PATH"
      - name: Assert environment directory exists
        env:
          ENV_PATH: ${{ steps.setup.outputs.environment-path }}
        run: |
          echo "Checking environment directory: $ENV_PATH"
          if [ ! -d "$ENV_PATH" ]; then
            echo "FAIL: environment directory does not exist at $ENV_PATH"
            exit 1
          fi
          echo "PASS: environment directory exists"
      - name: Assert python is installed in the environment
        env:
          ENV_PATH: ${{ steps.setup.outputs.environment-path }}
        run: |
          PYTHON_BIN="$ENV_PATH/bin/python"
          echo "Checking python binary at: $PYTHON_BIN"
          if [ ! -f "$PYTHON_BIN" ]; then
            echo "FAIL: python binary not found at $PYTHON_BIN"
            exit 1
          fi
          PYTHON_VERSION=$("$PYTHON_BIN" --version)
          echo "Python version: $PYTHON_VERSION"
          if echo "$PYTHON_VERSION" | grep -q "3.11"; then
            echo "PASS: Python 3.11 is installed in the environment"
          else
            echo "FAIL: expected Python 3.11 but got $PYTHON_VERSION"
            exit 1
          fi
