name: Test basic micromamba setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          micromamba-version: 'latest'
          micromamba-root-path: /tmp/micromamba-root
          micromamba-binary-path: /tmp/micromamba-bin/micromamba
          init-shell: bash
          log-level: info
          generate-run-shell: 'false'
          post-cleanup: shell-init
      - name: Assert micromamba binary exists
        run: |
          echo "Checking micromamba binary at /tmp/micromamba-bin/micromamba"
          if [ ! -f "/tmp/micromamba-bin/micromamba" ]; then
            echo "FAIL: micromamba binary not found at /tmp/micromamba-bin/micromamba"
            exit 1
          fi
          echo "PASS: micromamba binary found"
      - name: Assert micromamba is executable
        run: |
          if [ ! -x "/tmp/micromamba-bin/micromamba" ]; then
            echo "FAIL: micromamba binary is not executable"
            exit 1
          fi
          echo "PASS: micromamba binary is executable"
      - name: Assert micromamba version
        run: |
          /tmp/micromamba-bin/micromamba --version
          echo "PASS: micromamba --version succeeded"
