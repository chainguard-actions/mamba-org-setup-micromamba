name: Test basic setup-micromamba
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          micromamba-version: 'latest'
          log-level: 'info'
          init-shell: 'bash'
          generate-run-shell: 'false'
          post-cleanup: 'shell-init'
      - name: Assert micromamba is available
        run: |
          if ! command -v micromamba &> /dev/null; then
            echo "FAIL: micromamba not found on PATH"
            exit 1
          fi
          echo "PASS: micromamba is available"
          micromamba --version
