name: Test specific micromamba version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          micromamba-version: '2.0.5-0'
          init-shell: none
          generate-run-shell: false
      - name: Assert specific micromamba version is installed
        run: |
          echo "Checking micromamba binary..."
          if ! command -v micromamba &>/dev/null; then
            echo "FAIL: micromamba not found on PATH"
            exit 1
          fi
          VERSION=$(micromamba --version)
          echo "micromamba version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: micromamba --version returned empty"
            exit 1
          fi
          # Check that the version matches what we requested (major.minor.patch)
          if echo "$VERSION" | grep -qE '^2\.0\.5'; then
            echo "PASS: micromamba version $VERSION matches requested 2.0.5"
          else
            echo "FAIL: expected version 2.0.5.x but got $VERSION"
            exit 1
          fi
