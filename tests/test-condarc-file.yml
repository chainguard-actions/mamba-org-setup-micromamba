name: Test condarc-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          condarc-file: ${{ github.workspace }}/hardened/tests/fixtures/condarc/condarc.yml
          init-shell: none
          post-cleanup: shell-init
      - name: Assert micromamba is available
        run: |
          which micromamba || (echo "FAIL: micromamba not found on PATH" && exit 1)
          echo "PASS: micromamba is available"
      - name: Assert condarc channels are configured
        run: |
          micromamba config list --no-rc 2>/dev/null || true
          # Verify micromamba can run and the condarc was accepted (no error during setup)
          micromamba --version
          echo "PASS: micromamba configured with condarc-file"
