name: Test download and path options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          micromamba-binary-path: /tmp/custom-mamba-bin/micromamba
          micromamba-root-path: /tmp/custom-mamba-root
          log-level: warning
          init-shell: none
          post-cleanup: all
      - name: Assert micromamba binary is at custom path
        run: |
          echo "Checking micromamba binary at custom path..."
          if [ ! -f "/tmp/custom-mamba-bin/micromamba" ]; then
            echo "FAIL: micromamba binary not found at /tmp/custom-mamba-bin/micromamba"
            exit 1
          fi
          echo "PASS: micromamba binary found at custom path"
      - name: Assert micromamba root is at custom path
        run: |
          echo "Checking micromamba root at custom path..."
          if [ ! -d "/tmp/custom-mamba-root" ]; then
            echo "FAIL: micromamba root not found at /tmp/custom-mamba-root"
            exit 1
          fi
          echo "PASS: micromamba root found at custom path"
      - name: Assert micromamba runs correctly
        run: |
          /tmp/custom-mamba-bin/micromamba --version
          echo "PASS: micromamba runs correctly"
