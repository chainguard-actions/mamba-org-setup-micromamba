name: Test cache options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          environment-name: test-cache-env
          create-args: python=3.11
          cache-downloads: true
          cache-downloads-key: test-cache-downloads-key-${{ github.run_id }}
          cache-environment: true
          cache-environment-key: test-cache-environment-key-${{ github.run_id }}
          init-shell: none
          post-cleanup: environment
      - name: Assert micromamba is available
        run: |
          which micromamba || (echo "FAIL: micromamba not found on PATH" && exit 1)
          echo "PASS: micromamba is available"
      - name: Assert environment was created
        env:
          ENV_PATH: ${{ steps.action.outputs.environment-path }}
        run: |
          echo "environment-path: $ENV_PATH"
          if [ -z "$ENV_PATH" ]; then
            echo "FAIL: environment-path output is empty"
            exit 1
          fi
          if [ ! -d "$ENV_PATH" ]; then
            echo "FAIL: environment directory does not exist at $ENV_PATH"
            exit 1
          fi
          echo "PASS: environment exists at $ENV_PATH"
