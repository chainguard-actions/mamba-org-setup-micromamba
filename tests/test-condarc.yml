name: Test condarc configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-condarc-file
        uses: .
        with:
          condarc-file: actions/hardened/mamba-org--setup-micromamba/v3.0.0/tests/fixtures/condarc.yml
          micromamba-version: 'latest'
          init-shell: 'none'
          post-cleanup: 'all'
      - name: Assert micromamba is available after condarc-file setup
        run: |
          if ! command -v micromamba &> /dev/null; then
            echo "FAIL: micromamba not found on PATH"
            exit 1
          fi
          echo "PASS: micromamba is available"

  test-condarc-inline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-condarc
        uses: .
        with:
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          micromamba-version: 'latest'
          init-shell: 'none'
          post-cleanup: 'all'
      - name: Assert micromamba is available after condarc inline setup
        run: |
          if ! command -v micromamba &> /dev/null; then
            echo "FAIL: micromamba not found on PATH"
            exit 1
          fi
          echo "PASS: micromamba is available"
