name: Test micromamba condarc configuration
on:
  workflow_dispatch:
jobs:
  test-condarc-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          micromamba-version: 'latest'
          micromamba-root-path: /tmp/micromamba-root
          micromamba-binary-path: /tmp/micromamba-bin/micromamba
          condarc-file: actions/hardened/mamba-org--setup-micromamba/v2.0.7/tests/fixtures/condarc.yml
          init-shell: none
          log-level: info
          post-cleanup: all
      - name: Assert micromamba binary exists
        run: |
          if [ ! -f "/tmp/micromamba-bin/micromamba" ]; then
            echo "FAIL: micromamba binary not found"
            exit 1
          fi
          echo "PASS: micromamba binary found"

  test-condarc-inline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          micromamba-version: 'latest'
          micromamba-root-path: /tmp/micromamba-root
          micromamba-binary-path: /tmp/micromamba-bin/micromamba
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          init-shell: none
          log-level: warning
          post-cleanup: all
      - name: Assert micromamba binary exists
        run: |
          if [ ! -f "/tmp/micromamba-bin/micromamba" ]; then
            echo "FAIL: micromamba binary not found"
            exit 1
          fi
          echo "PASS: micromamba binary found"
